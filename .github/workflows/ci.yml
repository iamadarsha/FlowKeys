name: CI Build Check

# Non-release build verification for feature branches and PRs.
# The release workflow (release.yml) still runs only on v* tags.

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'design/**'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version
          xcrun --sdk macosx --show-sdk-path

      - name: Install tools
        run: |
          brew list cmake      >/dev/null 2>&1 || brew install cmake
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
          brew list fileicon    >/dev/null 2>&1 || brew install fileicon

      # Native engines (whisper.cpp + llama.cpp + sherpa-onnx, the last of which
      # compiles ONNX Runtime from source, ~90 min). Three-tier restore:
      #   1. GitHub Actions cache (fast, 7-day eviction)
      #   2. prebuilt tarball from the `native-libs-<key>` pre-release
      #      (published by Scripts/publish_native_libs.sh after a submodule bump)
      #   3. build from source (fallback; also re-populates tiers 1 & 2 material)
      # Key = first 16 hex of sha256(sorted submodule SHAs) — the libs depend
      # only on the vendored engine versions.
      - name: Native libs key
        id: nativekey
        run: echo "sub=$(git submodule status | awk '{gsub(/^[+-]/,\"\",$1); print $1}' | sort | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore native builds (cache)
        id: nativecache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/whisper
            build/llama
            build/sherpa
            build/Frameworks
          key: native-macos-${{ steps.nativekey.outputs.sub }}

      - name: Fetch prebuilt native libs (on cache miss)
        id: prebuilt
        if: steps.nativecache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="native-libs-${{ steps.nativekey.outputs.sub }}"
          if gh release download "$tag" --pattern 'native-macos.tar.gz' --dir . 2>/dev/null; then
            tar xzf native-macos.tar.gz && rm native-macos.tar.gz
            # make the restored tree newer than the fresh submodule checkout,
            # then bump the built artifacts once more so make treats them final
            find build/whisper build/llama build/sherpa build/Frameworks -exec touch {} +
            sleep 1
            find build/whisper build/llama build/sherpa build/Frameworks \
              \( -name '*.a' -o -name '*.dylib' \) -exec touch {} +
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ restored prebuilt native libs from $tag"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ no prebuilt asset $tag — building from source"
          fi

      - name: Build native engines (cache + prebuilt both missed)
        if: steps.nativecache.outputs.cache-hit != 'true' && steps.prebuilt.outputs.ok != 'true'
        run: ARCH=universal make whisper-libs llama-libs sherpa-libs

      - name: Save native builds (cache)
        if: always() && steps.nativecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/whisper
            build/llama
            build/sherpa
            build/Frameworks
          key: native-macos-${{ steps.nativekey.outputs.sub }}

      - name: Regression smoke (static checks + Local AI unit tests)
        run: ./Scripts/regression_smoke.sh

      - name: Build universal app + DMG
        run: |
          ARCH=universal make build
          ARCH=universal make dmg

      - name: Report DMG size
        run: |
          ls -lh build/FlowKeys.dmg
          echo "DMG_SIZE=$(du -h build/FlowKeys.dmg | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowKeys-${{ github.sha }}
          path: build/FlowKeys.dmg
          retention-days: 14
