name: CI Build Check

# Non-release build verification for feature branches and PRs.
# The release workflow (release.yml) still runs only on v* tags.

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'design/**'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version
          xcrun --sdk macosx --show-sdk-path

      - name: Install tools
        run: |
          brew list cmake      >/dev/null 2>&1 || brew install cmake
          brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
          brew list fileicon    >/dev/null 2>&1 || brew install fileicon

      # Cache the vendored native builds (whisper.cpp / llama.cpp / sherpa-onnx).
      # Keyed by submodule commits + the Makefile so a bump busts the cache.
      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            build/whisper
            build/llama
            build/sherpa
            build/Frameworks
            vendor/sherpa-onnx/build-macos
          key: native-${{ runner.os }}-${{ hashFiles('.gitmodules', 'Makefile', 'Sources/LocalAI/C*/**') }}-${{ hashFiles('vendor/**/CMakeLists.txt') }}

      - name: Regression smoke (static checks + Local AI unit tests)
        run: ./Scripts/regression_smoke.sh

      - name: Build universal app + DMG
        run: |
          make -j1 build
          make dmg

      - name: Report DMG size
        run: |
          ls -lh build/FlowKeys.dmg
          echo "DMG_SIZE=$(du -h build/FlowKeys.dmg | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowKeys-${{ github.sha }}
          path: build/FlowKeys.dmg
          retention-days: 14
