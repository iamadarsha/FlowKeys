name: Build and Release FlowKeys DMG

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install fileicon



      - name: Build universal DMG
        run: |
          ARCH=universal make dmg-hdiutil
        env:
          APP_NAME: FlowKeys
          BUNDLE_ID: com.flowkeys.app
          CODESIGN_IDENTITY: "-"

      - name: Verify DMG was created
        run: |
          ls -lh build/FlowKeys.dmg
          hdiutil verify build/FlowKeys.dmg

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload DMG
        uses: softprops/action-gh-release@v2
        with:
          name: "FlowKeys ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🎙 FlowKeys ${{ steps.version.outputs.VERSION }}
            
            **Install with one command:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```
            
            Or download the DMG below and drag to Applications.
            
            **First time opening the DMG manually?**
            Run this after copying to Applications:
            ```bash
            xattr -dr com.apple.quarantine /Applications/FlowKeys.app
            ```
            
            🇮🇳 Aapki awaaz, aapke words.
          files: build/FlowKeys.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
