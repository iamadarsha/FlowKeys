name: Build and Release FlowKeys DMG

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/create-dmg
            /usr/local/Cellar/fileicon
          key: brew-${{ runner.os }}-create-dmg-fileicon

      - name: Install build dependencies
        run: |
          brew install create-dmg fileicon || brew upgrade create-dmg fileicon || true

      - name: Verify source PNG exists
        run: |
          if [[ ! -f Resources/AppIcon-Source.png ]]; then
            echo "❌ Resources/AppIcon-Source.png not found"
            exit 1
          fi
          echo "✅ Source PNG: $(ls -lh Resources/AppIcon-Source.png)"

      - name: Generate AppIcon.icns from source PNG
        run: |
          mkdir -p build/AppIcon.iconset
          sips -z 16   16   Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_16x16.png
          sips -z 32   32   Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_16x16@2x.png
          sips -z 32   32   Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_32x32.png
          sips -z 64   64   Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_32x32@2x.png
          sips -z 128  128  Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_128x128.png
          sips -z 256  256  Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_128x128@2x.png
          sips -z 256  256  Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_256x256.png
          sips -z 512  512  Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_256x256@2x.png
          sips -z 512  512  Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 Resources/AppIcon-Source.png --out build/AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns -o Resources/AppIcon.icns build/AppIcon.iconset
          echo "✅ AppIcon.icns generated: $(ls -lh Resources/AppIcon.icns)"

      - name: Build universal DMG
        run: |
          ARCH=universal make dmg
        env:
          APP_NAME: FlowKeys
          BUNDLE_ID: com.flowkeys.app
          CODESIGN_IDENTITY: "-"

      - name: Verify DMG
        run: |
          ls -lh build/FlowKeys.dmg
          hdiutil verify build/FlowKeys.dmg
          # Mount and check app exists
          MOUNT=$(hdiutil attach build/FlowKeys.dmg -nobrowse -plist | \
            grep -A1 'mount-point' | grep '<string>' | \
            sed 's/.*<string>\(.*\)<\/string>/\1/' | head -1)
          if [[ -z "$MOUNT" ]]; then
            echo "❌ Could not mount DMG for verification"
            exit 1
          fi
          if [[ ! -d "$MOUNT/FlowKeys.app" ]]; then
            echo "❌ FlowKeys.app not found in DMG"
            hdiutil detach "$MOUNT" -quiet
            exit 1
          fi
          echo "✅ FlowKeys.app found in DMG"
          hdiutil detach "$MOUNT" -quiet

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload DMG
        uses: softprops/action-gh-release@v2
        with:
          name: "FlowKeys ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🎙 FlowKeys ${{ steps.version.outputs.VERSION }}

            **Install with one command:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            Or download the DMG below and drag FlowKeys to Applications.

            **Downloaded the DMG manually?** Run once after install:
            ```bash
            xattr -dr com.apple.quarantine /Applications/FlowKeys.app
            ```

            🇮🇳 Aapki awaaz, aapke words.
          files: build/FlowKeys.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
